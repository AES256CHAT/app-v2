name: Android APK

# Signed release APK on every push to main, on tags and on manual dispatch. The
# distribution keystore lives outside the repository (~/keys on the build box) and is
# injected as a secret; see docs/RELEASE_GUIDE.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships the Android SDK (ANDROID_HOME set); just make sure API 35 is there.
      - run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      # Stable debug signing key (repository secret) so test APKs can update each other.
      - run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android
      # Release build type: not debuggable (no run-as, no WebView DevTools socket), signed
      # with the distribution key. Debug builds are for local development only.
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk AES256CHAT.apk
          sha256sum AES256CHAT.apk > AES256CHAT.apk.sha256
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: AES256CHAT-apk
          path: |
            AES256CHAT.apk
            AES256CHAT.apk.sha256
          retention-days: 30
