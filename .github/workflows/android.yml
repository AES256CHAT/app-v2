name: Android APK

# Debug APK on every push to main and on manual dispatch. Release signing happens
# offline (docs/RELEASE_GUIDE.md) — no keystore lives in CI.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships the Android SDK (ANDROID_HOME set); just make sure API 35 is there.
      - run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AES256CHAT-debug.apk
          sha256sum AES256CHAT-debug.apk > AES256CHAT-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AES256CHAT-debug-apk
          path: |
            AES256CHAT-debug.apk
            AES256CHAT-debug.apk.sha256
          retention-days: 30
