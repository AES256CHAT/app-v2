# AES256CHAT web app: static SPA with strict headers. TLS is terminated by Traefik in front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers a <meta> CSP cannot set (frame-ancestors, HSTS, …). The page CSP itself is in index.html.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml;

    # Service worker and manifest must never be cached aggressively.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } try_files $uri =404; }

    # Hashed assets are immutable.
    location /_app/immutable/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    location ~* \.wasm$ { types { application/wasm wasm; } try_files $uri =404; }

    # SPA fallback: every route is the app shell.
    location / { try_files $uri $uri/ /index.html; }
}
